[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "yabgp/__init__.py"

[project]
name = "yabgp"
dynamic = ["version"]
description = "Yet Another Border Gateway Protocol Python Implementation"
readme = "README.rst"
requires-python = ">=3.13"
license = { text = "Apache License 2.0" }
authors = [{ name = "SmartBGP project team", email = "xiaoquwl@gmail.com" }]
keywords = ["BGP", "SDN"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
dependencies = [
  "Flask==3.1.3",
  "Flask-HTTPAuth==4.8.1",
  "Twisted==25.5.0",
  "netaddr==1.3.0",
  "oslo.config==10.3.0",
  "py-radix==1.1.0",
  "simplejson==4.1.1",
]

[project.urls]
Homepage = "https://smartbgp.github.io/"

[project.scripts]
yabgpd = "yabgp.agent.cmd:main"

[dependency-groups]
test = [
  "coverage>=7.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
dev = [
  "pyright>=1.1.402",
  "ruff>=0.11.10",
]
docs = [
  "sphinx>=8.0",
  "sphinx-rtd-theme>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["yabgp"]

[tool.hatch.build.targets.wheel.shared-data]
"etc/yabgp/yabgp.ini.sample" = "etc/yabgp/yabgp.ini.sample"

[tool.hatch.build.targets.sdist]
include = [
  "/etc/yabgp/yabgp.ini.sample",
  "/yabgp",
  "/README.rst",
]

[tool.coverage.run]
branch = true
source = ["yabgp"]
omit = ["yabgp/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Module docstring before imports triggers false E402; no executable code precedes imports here
"yabgp/message/attribute/nlri/ipv4_unicast.py" = ["E402"]

